 app.innerHTML=`<div class="card"><button class="tg" onclick="start()">トップへもどる</button><div class="sub">${T()}　<ruby>第<rt>だい</rt></ruby>${i+1}<ruby>問<rt>もん</rt></ruby> / ${D.length}<ruby>問<rt>もん</rt></ruby>　<ruby>現在<rt>げんざい</rt></ruby> ${pts()}<ruby>点<rt>てん</rt></ruby></div><div class="bar"><i style="width:${i/D.length*100}%"></i></div><p class="q">${q[0]}</p><div id="o">${order.map((o,k)=>`<button class="opt" onclick="ans(${k})">${q[5]?CN[k]+" ":""}${o.t}</button>`).join("")}</div><div id="r"></div></div>`}
function ans(k){
 if(picked!==null)return;picked=k;
 const q=Q[D[i]],ok=order[k].c;if(ok)score++;H[D[i]]=ok?1:0;save();
 log.push({n:i+1,q:q[0],ok,a:q[1][q[2]],e:q[3]});
 document.querySelectorAll(".opt").forEach((b,j)=>{if(order[j].c)b.classList.add("ok");else if(j===k)b.classList.add("ng")});
 document.getElementById("r").innerHTML=`<div class="res ${ok?"ok":"ng"}">${ok?"⭕ <ruby>正解<rt>せいかい</rt></ruby>！ +"+(100/D.length).toFixed(1)+"<ruby>点<rt>てん</rt></ruby>":"❌ <ruby>不正<rt>ふせい</rt></ruby><ruby>解<rt>かい</rt></ruby> +0<ruby>点<rt>てん</rt></ruby>"}</div><p><b><ruby>解説<rt>かいせつ</rt></ruby>：</b>${q[3]}</p><button class="main" onclick="next()">${i===D.length-1?"<ruby>結果<rt>けっか</rt></ruby>を<ruby>見<rt>み</rt></ruby>る":"<ruby>次<rt>つぎ</rt></ruby>の<ruby>問<rt>もん</rt></ruby><ruby>題<rt>だい</rt></ruby>へ"}</button>`}
function next(){i++;i<D.length?show():end()}
function end(){
 const n=D.length,p=Math.round(score/n*100),ok=score/n>=PASS;
 app.innerHTML=`<div class="card"><h1>${T()}の<ruby>結果<rt>けっか</rt></ruby></h1><div class="big">${p} / 100<ruby>点<rt>てん</rt></ruby></div><p>${score} / ${n}<ruby>問<rt>もん</rt></ruby> <ruby>正解<rt>せいかい</rt></ruby>　<ruby>合格<rt>ごうかく</rt></ruby>ライン 75<ruby>点<rt>てん</rt></ruby><ruby>以上<rt>いじょう</rt></ruby></p><div class="res ${ok?"ok":"ng"}" style="font-size:1.3rem">${ok?" <ruby>合格<rt>ごうかく</rt></ruby>！":"<ruby>不合格<rt>ふごうかく</rt></ruby>　あと"+(Math.ceil(n*PASS)-score)+"<ruby>問<rt>もん</rt></ruby>"}</div><button class="main" onclick="go(${sel})">もう<ruby>一度<rt>いちど</rt></ruby><ruby>挑戦<rt>ちょうせん</rt></ruby>（<ruby>新<rt>あたら</rt></ruby>しい<ruby>問<rt>もん</rt></ruby><ruby>題<rt>だい</rt></ruby>を<ruby>優先<rt>ゆうせん</rt></ruby>）</button><button class="main" style="margin-top:8px;background:var(--sub)" onclick="start()">トップへもどる</button></div><div class="card"><h1><ruby>間違<rt>まちが</rt></ruby>えた<ruby>問<rt>もん</rt></ruby><ruby>題<rt>だい</rt></ruby>の<ruby>復習<rt>ふくしゅう</rt></ruby></h1>${log.filter(l=>!l.ok).map(l=>`<div class="rv"><b><ruby>第<rt>だい</rt></ruby>${l.n}<ruby>問<rt>もん</rt></ruby></b> ${l.q}<br><ruby>正解<rt>せいかい</rt></ruby>：${l.a}<br><span class="sub">${l.e}</span></div>`).join("")||"<ruby>全<rt>ぜん</rt></ruby><ruby>問<rt>もん</rt></ruby><ruby>正解<rt>せいかい</rt></ruby>です！！"}</div>`}
start();
</script></body></html>
